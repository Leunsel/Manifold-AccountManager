name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if (-not ($env:GITHUB_REF_NAME -match '^v([0-9]{1,5})\.([0-9]{1,5})\.([0-9]{1,5})$')) {
              throw "Tag '$env:GITHUB_REF_NAME' is not of the form v1.2.3"
          }
          $parts = foreach ($i in 1..3) { [int]$Matches[$i] }
          if ($parts | Where-Object { $_ -gt 65535 }) { throw "Tag '$env:GITHUB_REF_NAME': each part must be 0..65535" }
          $commas = '{0},{1},{2},0' -f $parts
          $dots = '{0}.{1}.{2}.0' -f $parts
          $path = Join-Path $PWD 'Manifold-Vault/Resources/App.rc'
          $text = [IO.File]::ReadAllText($path)
          $numbers = '(?m)^(\s*(?:FILEVERSION|PRODUCTVERSION)\s+)\d+,\d+,\d+,\d+'
          $strings = '(VALUE "(?:FileVersion|ProductVersion)",\s*")[\d.]+(")'
          $found = [regex]::Matches($text, $numbers).Count + [regex]::Matches($text, $strings).Count
          if ($found -ne 4) { throw "Expected 4 version entries in $path, found $found" }
          $text = [regex]::Replace($text, $numbers, "`${1}$commas")
          $text = [regex]::Replace($text, $strings, "`${1}$dots`${2}")
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($true))
          Write-Host "Version $dots"

      - name: Build Release
        run: msbuild Manifold-Vault.sln -m -nologo -v:minimal -p:Configuration=Release -p:Platform=x64

      - name: Build Debug
        run: msbuild Manifold-Vault.sln -m -nologo -v:minimal -p:Configuration=Debug -p:Platform=x64

      - name: Test Release
        timeout-minutes: 10
        run: ./x64/Release/Bunker.Tests.exe --headless

      - name: Test Debug
        timeout-minutes: 10
        run: ./x64/Debug/Bunker.Tests.exe --headless

      - name: Check fixed pixel sizes
        run: python Tools/check_ui_scale.py

      - name: Check for personal data
        run: python Tools/check_no_personal.py

      - name: Package
        run: |
          $label = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0, 7) }
          $name = "Manifold-Vault-$label-x64"
          $folder = "dist/$name"
          New-Item -ItemType Directory -Path "$folder/Licenses" -Force | Out-Null
          Copy-Item x64/Release/Vault.exe $folder
          Copy-Item LICENSE $folder
          Copy-Item Licenses/*.txt "$folder/Licenses"
          Compress-Archive -Path $folder -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD "dist/$name.zip.sha256"), "$hash  $name.zip`n")
          Write-Host "$hash  $name.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: package
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check for an existing release
        id: existing
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$draft" = true ]; then
              echo "::error::A draft release $GITHUB_REF_NAME exists; publish or delete it, then re-run."
              exit 1
            fi
            echo "::notice::Release $GITHUB_REF_NAME already exists; left unchanged."
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.existing.outputs.found != 'true'
        with:
          name: package
          path: dist

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: steps.existing.outputs.found != 'true'
        with:
          subject-path: dist/*.zip

      - name: Publish the release
        if: steps.existing.outputs.found != 'true'
        run: |
          notes="Check the download: gh attestation verify Manifold-Vault-${GITHUB_REF_NAME}-x64.zip --repo ${GH_REPO}"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes "$notes" --generate-notes
